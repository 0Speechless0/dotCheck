Listen 8181

<VirtualHost *:8181>
    ServerName _

    ProxyPreserveHost On
    ProxyRequests Off

    # Blazor Interactive Server / SignalR WebSocket connection
    ProxyPass        /_blazor ws://127.0.0.1:5000/_blazor
    ProxyPassReverse /_blazor ws://127.0.0.1:5000/_blazor

    ProxyPass        / http://127.0.0.1:5000/
    ProxyPassReverse / http://127.0.0.1:5000/

    RequestHeader set X-Forwarded-Proto "http"
    RequestHeader set X-Forwarded-Port "8181"

    ErrorLog ${APACHE_LOG_DIR}/dotcheck_error.log
    CustomLog ${APACHE_LOG_DIR}/dotcheck_access.log combined
</VirtualHost>
